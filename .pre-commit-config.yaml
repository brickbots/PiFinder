# Each hook runs python/scripts/check.sh, the same script and dev shell as CI.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint and format check
        entry: python/scripts/check.sh lint
        language: system
        files: ^python/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy type check
        entry: python/scripts/check.sh types
        language: system
        files: ^python/.*\.py$
        pass_filenames: false
      - id: smoke-tests
        name: smoke tests
        entry: python/scripts/check.sh smoke
        language: system
        files: ^python/.*\.py$
        pass_filenames: false
