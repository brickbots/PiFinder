["NGC 2034"]
why = "Bica 2008 classes it a plain association (A, in LH84) with no nebula, and SIMBAD As*; Steinicke's OCL+EN adds a nebula that is not there."
sources = [
    "https://vizier.cds.unistra.fr/viz-bin/VizieR?-source=J/MNRAS/389/678",
    "https://simbad.cds.unistra.fr/simbad/sim-id?Ident=NGC%202034",
    "https://github.com/mattiaverga/OpenNGC/blob/master/database_files/NGC.csv",
]
obj_type = "OC"
was.obj_type = "C+N"

["NGC 1943"]
why = "A ~220 Myr populous LMC cluster (Baumgardt 2013; Bica 2008 class C, nebula LMC-N130 only possibly superposed; SIMBAD Cl*); Steinicke's EN+OCL nebula reading is not supported. OpenNGC's GCl is the young-populous-cluster convention."
sources = [
    "https://vizier.cds.unistra.fr/viz-bin/VizieR?-source=J/MNRAS/430/676",
    "https://vizier.cds.unistra.fr/viz-bin/VizieR?-source=J/MNRAS/389/678",
