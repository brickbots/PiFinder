["NGC 2244"]
why = "The ~4 Myr cluster (Hunt & Reffert 2023) that ionises the Rosette Nebula; Steinicke's remark 'in Rosette nebula' but class 'II3p' has no 'n'. C 50: the catalog's 06 32 19.0 +04 51 24 (Steinicke) is 7.0' from the Gaia centre (r50 6.3'), 8.1' from Corwin and 4.0' from SIMBAD, to the southeast; OpenNGC is 1.0' from the Gaia centre. Minor, but it is a Caldwell object. Structure: the catalog also keeps NGC 2239 (= NGC 2244) as a second object at the same point."
sources = [
    "https://vizier.cds.unistra.fr/viz-bin/VizieR?-source=J/A+A/673/A114",
    "https://en.wikipedia.org/wiki/Rosette_Nebula",
    "https://simbad.cds.unistra.fr/simbad/sim-id?Ident=NGC%202244",
    "http://www.klima-luft.de/steinicke/ngcic/rev2000/Explan.htm",
    "https://github.com/mattiaverga/OpenNGC/blob/master/database_files/NGC.csv",
    "https://ned.ipac.caltech.edu/byname?objname=NGC%202244",
    "https://vizier.cds.unistra.fr/viz-bin/VizieR-3?-source=J/A%2BA/673/A114/clusters",
    "http://haroldcorwin.net/ngcic/ngconly.txt",
]
obj_type = "C+N"
ra = "06 31 56.5"
dec = "+04 55 36"
was.obj_type = "OC"
was.ra = "06 32 19.00"
was.dec = "+04 51 24.0"

["NGC 2579"]
why = "An HII region ionised by three O stars of its embedded cluster (Copetti et al. 2007); Dreyer 'D* in pS neb, am 70 st'. Steinicke gives only a Trumpler class. Steinicke 19' is about twice every other estimate; OpenNGC's MajAx for clusters comes from HEASARC mwsc 'central_radius' (Kharchenko et al. 2013 r1) and is the radius in arcmin stored as a diameter: it equals 60*r1 exactly (0.055 deg)."
sources = [
    "https://arxiv.org/abs/0707.2062",
    "https://simbad.cds.unistra.fr/simbad/sim-id?Ident=NGC%202579",
    "http://www.klima-luft.de/steinicke/ngcic/rev2000/Explan.htm",
    "https://github.com/mattiaverga/OpenNGC/blob/master/database_files/NGC.csv",
    "Kharchenko+ 2013 MWSC, VizieR J/A+A/558/A53",
    "Dias+ 2002 v3.5, VizieR B/ocl",
    "Lynga 1987, VizieR VII/92A",
    "NGC 2000.0 (Sinnott 1988), PiFinder astro_data/ngc_ic_m/ngc2000/ngc2000.dat",
    "OpenNGC README (data sources) and NGC.csv Sources column",
]
obj_type = "C+N"
size = "10'"
was.obj_type = "OC"
was.size = "19'"

