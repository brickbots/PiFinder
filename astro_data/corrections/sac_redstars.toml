["SaR 139"]
why = "A variable whose catalog magnitude is not Hipparcos's V, so the cross-match's V gate turns its star away. Evidence: BD +58 1772a is HIP 87820's; SIMBAD gives T Dra = BD+58 1772a = HIP 87820; 0.14' from HIP 87820. SAC gives T Dra one value, 7.2, its maximum. T Dra is a Mira; its V range is 7.2-13.5 (GCVS)."
sources = [
    "https://simbad.cds.unistra.fr/simbad/sim-id?Ident=HIP%2087820",
    "https://simbad.cds.unistra.fr/simbad/sim-id?Ident=T%20Dra",
    "GCVS B/gcvs via VizieR (T Dra M 7.2-13.5 V)",
]
hip = 87820
mag = [7.2, 13.5]
was.mag = 10

