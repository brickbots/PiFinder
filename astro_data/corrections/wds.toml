["WDS 99456"]
why = "WDS gives this pair's magnitudes in the K band (its note K: 'Summary line gives K-band or other infrared (>1 micron) magnitudes'), so the cross-match's V gate turns its star away: WDS's 4.94 is K, and HIP 94645's V is 6.25. Evidence: 1.4\" from SIMBAD's HD 179949 = HIP 94645 (Gumala, IAU WGSN)."
sources = [
    "https://simbad.cds.unistra.fr/simbad/sim-id?Ident=HIP%2094645",
